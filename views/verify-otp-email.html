<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verify your email</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background-color:#111827;padding:24px;text-align:center;">
              <span style="color:#ffffff;font-size:20px;font-weight:bold;">Motovex</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h2 style="margin:0 0 16px;color:#111827;font-size:18px;">Hi {{ name }},</h2>
              <p style="margin:0 0 20px;color:#374151;font-size:14px;line-height:1.6;">
                Use the code below to verify your email address.
              </p>
              <div style="margin:0 0 20px;padding:16px;background-color:#f3f4f6;border-radius:6px;text-align:center;">
                <span style="font-size:28px;letter-spacing:6px;font-weight:bold;color:#111827;">{{ otp }}</span>
              </div>
              <p style="margin:0 0 8px;color:#6b7280;font-size:13px;">
                This code expires in {{ expiryMinutes }} minutes.
              </p>
              <p style="margin:0;color:#6b7280;font-size:13px;">
                If you didn't request this, you can safely ignore this email.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px;background-color:#f9fafb;text-align:center;">
              <span style="color:#9ca3af;font-size:12px;">&copy; {{ year }} Motovex. All rights reserved.</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
